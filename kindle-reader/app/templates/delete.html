<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Удаление книги</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="page">
    <div class="topbar">
      <h1>Удаление книги</h1>
      <a class="button" href="/?page={{ page }}">← В библиотеку</a>
    </div>

    <div class="delete-confirmation">
      <p>Удалить книгу?</p>
      <p class="delete-book-name">{{ name }}</p>
      {% if is_local %}
        <p class="delete-note">Книга хранится локально на сервере и будет удалена безвозвратно.</p>
      {% else %}
        <p class="delete-note">Книга будет перемещена в корзину Яндекс Диска, откуда её можно восстановить.</p>
      {% endif %}

      {% if error %}<p class="error">{{ error }}</p>{% endif %}

      <form method="post" action="/delete">
        <input type="hidden" name="path" value="{{ path }}">
        <input type="hidden" name="page" value="{{ page }}">
        <button class="danger-button" type="submit">Удалить книгу</button>
        <a class="button cancel-button" href="/?page={{ page }}">Отмена</a>
      </form>
    </div>
  </div>
</body>
</html>
