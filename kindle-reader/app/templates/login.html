<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Читалка</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="login-box">
    <h1>Читалка</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ request.query_params.get('next', '/') }}">
      <label for="login-user">Кто читает?</label>
      <select id="login-user" name="user_id" required>
        {% for user_id, name in users %}
          <option value="{{ user_id }}"{% if selected_user == user_id %} selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
      <input type="password" name="password" placeholder="Пароль" autofocus required>
      <button type="submit">Войти</button>
    </form>
  </div>
</body>
</html>
